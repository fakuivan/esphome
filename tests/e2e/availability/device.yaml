substitutions:
  api_port: "6053"

esphome:
  name: availability-e2e
  friendly_name: Availability E2E
  devices:
    - id: child_module
      name: Child Module

host:

api:
  port: ${api_port}

logger:

switch:
  - platform: template
    id: individual_target
    name: Individual Target
    optimistic: true

  - platform: template
    id: child_target
    name: Child Target
    device_id: child_module
    optimistic: true

button:
  - platform: template
    name: Make Child Unavailable
    on_press:
      - device.set_available:
          id: child_module
          available: false

  - platform: template
    name: Make Child Available
    on_press:
      - device.set_available:
          id: child_module
          available: true

  - platform: template
    name: Make Individual Unavailable
    on_press:
      - entity.set_available:
          id: individual_target
          available: false

  - platform: template
    name: Make Individual Available
    on_press:
      - entity.set_available:
          id: individual_target
          available: true
